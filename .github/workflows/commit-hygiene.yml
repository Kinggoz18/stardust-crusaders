# Commit hygiene for cloud agents (team plan 0.8, E). Copy to .github/workflows/commit-hygiene.yml
# and make "commit-hygiene" a required check in branch protection.
# Fails on Signed-off-by, Co-authored-by, or agent-attribution trailers, and on signed commits.
# Pull requests are checked strictly. On pushes, commits that GitHub itself committed and signed
# (merges made in the web UI) are the only exception, because GitHub signs those automatically.
name: commit-hygiene
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  commit-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: No trailers, no signatures
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE..$PR_HEAD"; allow_webflow=0
          elif [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = 0000000000000000000000000000000000000000 ]; then
            range="$PUSH_AFTER"; allow_webflow=1
          else
            range="$PUSH_BEFORE..$PUSH_AFTER"; allow_webflow=1
          fi
          pattern='^[[:space:]]*(co-authored-by|signed-off-by|made-with|generated-by|assisted-by|ai-assisted-by)[[:space:]]*:|cursoragent@cursor\.com'
          bad=0 n=0
          for sha in $(git rev-list "$range"); do
            n=$((n+1)); short=$(git rev-parse --short "$sha")
            if git log -1 --format=%B "$sha" | grep -qiE "$pattern"; then
              echo "::error::$short has a forbidden trailer"; bad=1
            fi
            if git cat-file commit "$sha" | sed '/^$/q' | grep -qE '^gpgsig(-sha256)? '; then
              if [ "$allow_webflow" = 1 ] && [ "$(git log -1 --format=%ce "$sha")" = noreply@github.com ]; then
                echo "note: $short signed by GitHub web-flow (web UI merge)"
              else
                echo "::error::$short is signed. Commits must be plain and unsigned."; bad=1
              fi
            fi
          done
          echo "commit hygiene: $n commit(s) in $range: $([ $bad -eq 0 ] && echo clean || echo FAILED)"
          exit $bad
